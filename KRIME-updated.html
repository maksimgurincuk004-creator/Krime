function setN(n){if(busy)return;NQ=n;openCase(cur)}
function fill(ws){const c=CASES[cur];for(let k=0;k<NQ;k++){const a=Array.from({length:60},()=>pk(c));if(ws)a[48]=ws[k];$('st'+k).innerHTML=a.map(s=>card(s)).join('')}}
function spin(){if(busy)return;const c=CASES[cur],n=NQ,tot=c.p*n;if(G.g<tot){toast('Недостаточно G');return}
busy=1;G.g-=tot;G.spent+=tot;G.op+=n;const ws=Array.from({length:n},()=>pk(c)),ids=ws.map(w=>{const u=G.uid++;G.inv.push({u,s:w.id});if(G.best==null||w.p>SK[G.best].p)G.best=w.id;return u});save();hud();
$('res').innerHTML='';fill(ws);$('ob').disabled=true;const rl=document.querySelector('.rl');
for(let k=0;k<n;k++){const st=$('st'+k);st.style.transition='none';st.style.transform='translateX(0)';void st.offsetWidth;const off=48*112+56-rl.clientWidth/2+(Math.random()*60-30);st.style.transition=`transform ${5.5+k*.25}s cubic-bezier(.1,.75,.12,1)`;st.style.transform=`translateX(${-off}px)`}
sndSpin();
setTimeout(()=>{busy=0;const m=Math.max(...ws.map(w=>w.r));sndDrop(m);if(m>=3)boom(20+m*12);const b=$('ob');if(b)b.disabled=false;const r=$('res');if(r)r.innerHTML=`<div class="grid s" style="margin:12px 0">${ws.map(w=>`<div>${card(w)}</div>`).join('')}</div><button class="btn ghost" style="margin:0 0 12px" onclick="sellMany([${ids}])">Обменять ${n>1?'все ':''}за ${f(ws.reduce((a,w)=>a+w.p,0))} G</button>`},5800+n*250)}
function sellMany(ids){let v=0;ids.forEach(u=>{const i=G.inv.findIndex(x=>x.u==u);if(i>=0){v+=SK[G.inv[i].s].p;G.inv.splice(i,1)}});if(!v)return;G.g+=v;if(!G.inv.some(x=>x.u==US)){US=null;UT=null}save();hud();$('res').innerHTML=`<p class="ctr mute">Обмен выполнен · ${f(v)} G</p>`}
/* апгрейд: источник — скин или голда (до 1 000 000 G) */
const src=()=>{if(UM)return UG>=1?{id:-1,w:'ГОЛДА',n:'Ставка',p:UG,r:5,gold:1}:null;const it=G.inv.find(x=>x.u==US);return it?SK[it.s]:null};
const abv=s=>x=>s.gold?x.p>=s.p:x.p>s.p;
function vUp(){
 const s=src(),t=UT!=null?SK[UT]:null,ch=chance(s,t),mx=Math.min(1e6,Math.floor(G.g));
 const tg=s?SK.filter(x=>abv(s)(x)&&x.p<=s.p*15).sort((a,b)=>a.p-b.p):[];
 const invValue=G.inv.reduce((a,x)=>a+SK[x.s].p,0),multiplier=s&&t?(t.p/s.p).toFixed(2):'—';
 const sourceMarkup=UM
  ? `<div class="up-gold-source"><div class="up-gold-icon">G</div><div class="up-gold-copy"><b>${UG?f(UG)+' G':'Сумма не выбрана'}</b><span>Ваша ставка для апгрейда</span></div></div><div class="up-input-row"><input id="ug" type="number" inputmode="numeric" min="1" max="1000000" value="${UG||''}" placeholder="Введите сумму G"><button onclick="setUG()">Применить</button></div><div class="up-presets">${[100,1000,10000,100000].map(v=>`<button onclick="setUG(${v})">${f(v)}</button>`).join('')}<button onclick="setUG(${mx})">Макс.</button></div>`
  : `<div class="up-selected">${s?card(s):'<div class="up-empty"><span>＋</span><b>Выберите предмет</b><small>Он станет вашей ставкой</small></div>'}</div><div class="up-source-list">${G.inv.length?G.inv.map(x=>`<button class="up-inv-item ${x.u==US?'active':''}" onclick="pickS(${x.u})"><span class="up-inv-icon">${ico(SK[x.s].w)}</span><span><b>${SK[x.s].w}</b><small>${SK[x.s].n}</small></span><strong>${f(SK[x.s].p)} G</strong></button>`).join(''):'<p class="mute">Коллекция пока пуста. Откройте кейс, чтобы получить первый предмет.</p>'}</div>`;
 const targetMarkup=s
  ? `<div class="up-target-selected">${t?card(t):'<div class="up-empty"><span>✦</span><b>Выберите цель</b><small>Предмет дороже исходного</small></div>'}</div><div class="up-target-tools">${qk()}</div><div class="up-target-list">${tg.length?tg.map(x=>`<button class="up-inv-item ${x.id==UT?'active':''}" onclick="pickT(${x.id})"><span class="up-rarity-dot r${x.r}"></span><span><b>${x.w}</b><small>${x.n}</small></span><strong>${f(x.p)} G</strong></button>`).join(''):'<p class="mute">Для этой ставки пока нет подходящих целей.</p>'}</div>`
  : `<div class="up-empty up-target-placeholder"><span>✧</span><b>Будущая находка</b><small>Сначала выберите предмет или сумму голды</small></div>`;
 return `<section class="up-intro"><div class="up-kicker"><span></span> KRIME LAB · UPGRADE SYSTEM</div><h2>Подними уровень<br><em>своей коллекции.</em></h2><p>Выбери предмет, задай цель и испытай удачу. Всё под контролем — от шанса до результата.</p><div class="up-metrics"><div><small>БАЛАНС</small><b>${f(G.g)} <i>G</i></b></div><div><small>В КОЛЛЕКЦИИ</small><b>${G.inv.length} <i>предм.</i></b></div><div><small>СТОИМОСТЬ ИНВЕНТАРЯ</small><b>${f(invValue)} <i>G</i></b></div></div></section>
 <div class="up-mode"><div><b>Тип улучшения</b><small>Выбери, чем рискнуть</small></div><div class="up-mode-switch">${['Скины','Голда'].map((n,i)=>`<button class="${i==UM?'on':''}" onclick="setUM(${i})">${i?'◈':'◇'} ${n}</button>`).join('')}</div></div>
 <section class="up-machine"><div class="up-machine-head"><div><span class="up-eyebrow">01 / YOUR SETUP</span><h3>Собери улучшение</h3></div><span class="up-live"><i></i> СИСТЕМА ГОТОВА</span></div>
 <div class="up-slots"><div class="up-slot"><div class="up-slot-label"><span>ВАША СТАВКА</span><b>01</b></div>${sourceMarkup}</div><div class="up-swap">→</div><div class="up-slot"><div class="up-slot-label"><span>ЖЕЛАЕМЫЙ ПРЕДМЕТ</span><b>02</b></div>${targetMarkup}</div></div>
 <div class="up-chance-panel"><div class="up-chance-copy"><span class="up-eyebrow">02 / PROBABILITY</span><b>Ваш шанс успеха</b><small>${s&&t?'Шанс рассчитан для выбранной цели':'Выберите ставку и цель, чтобы рассчитать шанс'}</small></div><div class="ring" id="ring" style="background:conic-gradient(#6b9b91 0 ${ch*3.6}deg,#e8eeeb 0)"><div class="pc"><b>${ch?ch.toFixed(1):'0'}%</b><small>вероятность</small></div><div class="ptr" id="ptr"></div></div><div class="up-chance-foot"><span><i class="up-dot good"></i> Успех</span><b>${ch?ch.toFixed(1)+'%':'—'}</b><span><i class="up-dot risk"></i> Неудача</span><b>${ch?(100-ch).toFixed(1)+'%':'—'}</b></div></div>
 <div class="up-summary"><div><small>СТОИМОСТЬ ЦЕЛИ</small><b>${t?f(t.p)+' G':'—'}</b></div><div><small>МНОЖИТЕЛЬ</small><b>${multiplier==='—'?'—':'×'+multiplier}</b></div><div><small>ПРИ УСПЕХЕ</small><b>${t?'+'+f(Math.max(0,t.p-(s?s.p:0)))+' G':'—'}</b></div></div>
 <button class="btn up-launch" id="ub" ${s&&t?'':'disabled'} onclick="doUp()"><span>Улучшить предмет</span><b>↗</b></button><p class="up-disclaimer">При неудаче исходная ставка сгорает. Проверь выбранные предметы перед запуском.</p></section>
 <div class="up-bottom-note"><span>✦</span><div><b>Твоя стратегия — твой выбор</b><small>Быстрый подбор шанса, точная цель и прозрачные условия каждого апгрейда.</small></div></div>`;
}
function setUM(m){if(busy)return;UM=m;US=null;UT=null;if(m)UG=Math.min(1000,Math.floor(G.g));autoT(50);render()}
function setUG(v){if(busy)return;if(v===undefined)v=+$('ug').value;UG=Math.max(0,Math.min(1e6,Math.floor(G.g),Math.floor(v)||0));UT=null;autoT(50);render()}
function autoT(k){const s=src();if(!s)return;const want=s.p*95/k;let b=null;SK.forEach(x=>{if(abv(s)(x)&&(!b||Math.abs(Math.log(x.p/want))<Math.abs(Math.log(b.p/want))))b=x});if(!b)toast('Выше этого целей нет');UT=b?b.id:null;render()}
function doUp(){if(busy)return;const s=src(),t=UT!=null?SK[UT]:null;if(!s||!t)return;
if(UM){if(UG>G.g){toast('Недостаточно G');return}G.g-=UG;hud()}
busy=1;const ch=chance(s,t),r=Math.random()*100,win=r<ch;$('ub').disabled=true;
const p=$('ptr');const duration=7800,total=360*7+r*3.6,start=performance.now();p.style.transition='none';p.style.transform='rotate(0deg)';p.style.willChange='transform';
sndCharge();
const spinFrame=now=>{const progress=Math.min(1,(now-start)/duration);const eased=1-Math.pow(1-progress,4);p.style.transform=`rotate(${total*eased}deg)`;if(progress<1){requestAnimationFrame(spinFrame);return;}p.style.willChange='auto';finishUp();};
const finishUp=()=>{busy=0;G.up++;if(!UM)G.inv=G.inv.filter(x=>x.u!=US);
if(win){G.uw++;G.inv.push({u:G.uid++,s:t.id});if(G.best==null||t.p>SK[G.best].p)G.best=t.id;sndWin();boom(70)}else sndLose();
US=null;UT=null;if(UM)UG=Math.min(UG,Math.floor(G.g));save();hud();render();
md(`<h2 class="ctr" style="padding-right:0">${win?'Улучшение прошло успешно':'В этот раз не получилось'}</h2><div class="won">${card(win?t:s)}</div><p class="ctr mute">${win?'Новый предмет уже в вашей коллекции.':UM?'Ставка не сыграла. Попробуйте ещё раз.':'Предмет не сохранился. Попробуйте ещё раз.'}</p><button class="btn" onclick="closeM()">Дальше</button>`)};requestAnimationFrame(spinFrame)}
const T={cases:['Кейсы',vCases],up:['Улучшение',vUp],ch:['Куриный забег',vCh],inv:['Моя коллекция',vInv],me:['Мой профиль',vMe]};
function render(){if(tab!='me')rs=0;$('nav').innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${T[k][0]}</button>`).join('');$('v').innerHTML=T[tab][1]();if(tab=='ch')chScroll()}
/* админка для GitHub: 5 тапов по логотипу KRIME + пароль */
const APW='krime2026';
function admOk(){if($('ap').value===APW){ADM=1;try{localStorage.setItem('krime_adm','1')}catch(e){}$('adb').hidden=false;shown=null;hud();adm()}else toast('Неверный код')}
try{if(localStorage.getItem('krime_adm')=='1'){ADM=1;$('adb').hidden=false}}catch(e){}
{let n=0,t;document.querySelector('.logo').addEventListener('click',()=>{clearTimeout(t);t=setTimeout(()=>n=0,1500);if(++n<5)return;n=0;if(ADM)adm();else md(`<h2 style='padding-right:40px'>Доступ администратора</h2><div class='bet' style='grid-template-columns:1fr 100px'><input id='ap' type='password' placeholder='Код доступа'><button style='font-size:14px' onclick='admOk()'>Войти</button></div>`)})}
/* иконки оружия (силуэты по типу) */
const CT={USP:'p',G22:'p',P350:'p',Deagle:'p','TEC-9':'p',UMP45:'s',MP7:'s',P90:'s',M4:'r',M16:'r',AKR:'r',AKR12:'r',M40:'n',AWM:'n',SM1014:'h','FP-6':'h',Karambit:'k',M9:'f',Butterfly:'f',Flip:'f',Kunai:'f',Scorpion:'f'},
IP={p:'M8 6H52V14H37L34 18L30 28H21L25 18V14H8Z',s:'M4 9H14L17 6H51V14H34L32 17H24V28H17V17H12L4 19Z',r:'M2 12L12 11L18 8H46V12H62V15H46V17H34L32 20H25L23 29H16L18 20H12L10 22H2Z',n:'M2 16H18L22 13H34V10H46V13H62V17H38L35 20H27L25 29H18L20 20H2Z',h:'M2 13H48V17H36V20H2ZM36 17H44V20H36ZM46 13L60 16L58 25L50 22Z',f:'M3 16L30 8L42 12V20L30 24ZM42 8H46V24H42ZM46 11H60V21H46Z',k:'M8 6C34 3 46 18 35 29C31 20 24 14 8 12Z'};
const ico=w=>{const k=CT[w];return `<svg class="ic" viewBox="0 0 64 32" aria-hidden="true">${k?`<path d="${IP[k]}" fill="currentColor"/>`:`<circle cx="32" cy="16" r="13" fill="currentColor"/><text x="32" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">G</text>`}</svg>`};
/* мягкие звуки: колокольчики по пентатонике */
const PN=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
const bell=(q,t,d=.9,v=.12)=>{tone(q,t,d,'sine',v);tone(q*2,t,d*.5,'sine',v*.25)};
const sndWin=()=>{[0,2,4,5,7,8].forEach((k,i)=>{bell(PN[k],i*.105,1.25,.085);tone(PN[k]*.5,i*.105,.75,'triangle',.025)});setTimeout(()=>bell(1567.98,.02,.8,.045),560)};
const sndLose=()=>{bell(392,0,.75,.065);bell(329.63,.16,.85,.06);bell(261.63,.34,1,.045)};
const sndCharge=()=>{for(let i=0;i<12;i++){const t=i*.31;tone(180+i*34,t,.42,'triangle',.028);tone(520+i*24,t,.28,'sine',.018)}};
const sndSpin=()=>{for(let i=0;i<24;i++){const t=Math.pow(i/24,.72)*5.25;bell(520+i*17,t,.16,.018)}};
const sndDrop=r=>{const base=Math.min(7,Math.max(0,r));[0,2,4,6].forEach((k,i)=>bell(PN[Math.min(k+base,8)],i*.095,.95+r*.12,.075));if(r>=4)setTimeout(()=>bell(1760,.02,1.1,.045),390)};
const sndStep=()=>{tone(620,0,.16,'triangle',.045);tone(880,.045,.25,'sine',.035)};
const sndCrash=()=>{tone(185,0,.42,'triangle',.09);tone(110,.04,.55,'sine',.055);tone(72,.08,.38,'triangle',.035)};
const sndCash=()=>{bell(659.25,0,.65,.07);bell(880,.12,.8,.065);bell(1318.51,.25,1,.05)};
Object.assign(window,{CH,adm,admOk,setN,setUM,setUG,sellMany,agive,askin,autoC,autoT,bet,bonus,chCash,chStart,chStep,closeM,doUp,go,openCase,pickS,pickT,reset,sell,sellAll,setBet,setD,spin});
hud();render();(function(){const fl=$('fl');['🎃','🦇','👻','🕸️','🎃','🦇'].forEach((e,i)=>{const s=document.createElement('i');s.textContent=e;s.style.cssText=`left:${8+i*16}%;animation-delay:${-i*3}s;animation-duration:${14+i*2}s`;fl.appendChild(s)});try{window.claude&&claude.use('user').then(u=>{if(u&&u.isOwner()){ADM=1;$('adb').hidden=false;shown=null;hud()}}).catch(()=>{})}catch(e){}})();

})();
