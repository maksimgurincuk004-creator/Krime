/* KRIME case catalog — compact showcase layout */

else if(fl&&y){c+=' cash';h=`Забрать ${f(y.b*R.m)} G<small>Сейчас x${R.m.toFixed(2)}</small>`}else{c+=' off';h='Дождитесь окончания игры'}
const k=c+h;if(R.bk!==k){R.bk=k;const b=$('rkbt');b.className=c;b.innerHTML=h;b.disabled=/ off/.test(c)}
