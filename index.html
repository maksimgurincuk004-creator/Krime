setTimeout(()=>{busy=0;const m=Math.max(...ws.map(w=>w.r));sndDrop(m);if(m>=3)boom(20+m*12);const b=$('ob');if(b)b.disabled=false;const r=$('res');if(r)r.innerHTML=`<div class="grid s" style="margin:12px 0">${ws.map(w=>`<div>${card(w)}</div>`).join('')}</div><button class="btn ghost" style="margin:0 0 12px" onclick="sellMany([${ids}])">Продать ${n>1?'все ':''}за ${f(ws.reduce((a,w)=>a+w.p,0))} G</button>`},5800+n*250)}
function sellMany(ids){let v=0;ids.forEach(u=>{const i=G.inv.findIndex(x=>x.u==u);if(i>=0){v+=SK[G.inv[i].s].p;G.inv.splice(i,1)}});if(!v)return;G.g+=v;if(!G.inv.some(x=>x.u==US)){US=null;UT=null}save();hud();$('res').innerHTML=`<p class="ctr mute">Продано за ${f(v)} G</p>`}
/* апгрейд: источник — скин или голда (до 1 000 000 G) */
const src=()=>{if(UM)return UG>=1?{id:-1,w:'ГОЛДА',n:'Ставка',p:UG,r:5,gold:1}:null;const it=G.inv.find(x=>x.u==US);return it?SK[it.s]:null};
const abv=s=>x=>s.gold?x.p>=s.p:x.p>s.p;
function vUp(){const s=src(),t=UT!=null?SK[UT]:null,ch=chance(s,t),mx=Math.min(1e6,Math.floor(G.g));
const tg=s?SK.filter(x=>abv(s)(x)&&x.p<=s.p*15).sort((a,b)=>a.p-b.p):[];
const inv=UM?`<h3>Ставка голды (максимум 1 000 000)</h3><div class='bet' style='grid-template-columns:1fr 100px'><input id='ug' type='number' inputmode='numeric' min='1' max='1000000' value='${UG||''}' placeholder='Сколько G'><button style='font-size:14px' onclick='setUG()'>Ок</button></div><div class='tbs' style='grid-template-columns:repeat(5,1fr)'>${[100,1e3,1e4,1e5].map(v=>`<button onclick='setUG(${v})'>${f(v)}</button>`).join('')}<button onclick='setUG(${mx})'>Макс</button></div>`:`<h3>Ваш скин</h3>${G.inv.length?`<div class="grid s">${G.inv.map(x=>card(SK[x.s],`onclick="pickS(${x.u})"`,x.u==US)).join('')}</div>`:'<p class="mute">Нужен хотя бы один скин. Откройте кейс.</p>'}`;
return `<h2>Апгрейд</h2><div class='tbs' style='grid-template-columns:1fr 1fr'>${['Скины','Голда'].map((n,i)=>`<button class='${i==UM?'on':''}' onclick='setUM(${i})'>${n}</button>`).join('')}</div><div class="ring" id="ring" style="background:conic-gradient(var(--org) 0 ${ch*3.6}deg,var(--ring) 0)"><div class="pc"><b>${ch?ch.toFixed(1):0}%</b><small>шанс</small></div><div class="ptr" id="ptr"></div></div>
<div class="pair"><div>${s?card(s):`<div class="sk empty">${UM?'Нет голды':'Выберите свой скин'}</div>`}</div><div>${t?card(t):'<div class="sk empty">Выберите цель</div>'}</div></div>
${s?qk():''}<button class="btn" id="ub" ${s&&t?'':'disabled'} onclick="doUp()">Апгрейд</button>
${inv}${s?`<h3>Цель</h3>${tg.length?`<div class="grid s">${tg.map(x=>card(x,`onclick="pickT(${x.id})"`,x.id==UT)).join('')}</div>`:'<p class="mute">Для этой ставки целей выше нет.</p>'}`:''}`}
function setUM(m){if(busy)return;UM=m;US=null;UT=null;if(m)UG=Math.min(1000,Math.floor(G.g));autoT(50);render()}
function setUG(v){if(busy)return;if(v===undefined)v=+$('ug').value;UG=Math.max(0,Math.min(1e6,Math.floor(G.g),Math.floor(v)||0));UT=null;autoT(50);render()}
function autoT(k){const s=src();if(!s)return;const want=s.p*95/k;let b=null;SK.forEach(x=>{if(abv(s)(x)&&(!b||Math.abs(Math.log(x.p/want))<Math.abs(Math.log(b.p/want))))b=x});if(!b)toast('Выше этого целей нет');UT=b?b.id:null;render()}
function doUp(){if(busy)return;const s=src(),t=UT!=null?SK[UT]:null;if(!s||!t)return;
if(UM){if(UG>G.g){toast('Не хватает G');return}G.g-=UG;hud()}
busy=1;const ch=chance(s,t),r=Math.random()*100,win=r<ch;$('ub').disabled=true;
const p=$('ptr');p.style.transition='none';p.style.transform='rotate(0deg)';void p.offsetWidth;
p.style.transition='transform 4.6s cubic-bezier(.12,.7,.1,1)';p.style.transform=`rotate(${2160+r*3.6}deg)`;sndCharge();
setTimeout(()=>{busy=0;G.up++;if(!UM)G.inv=G.inv.filter(x=>x.u!=US);
if(win){G.uw++;G.inv.push({u:G.uid++,s:t.id});if(G.best==null||t.p>SK[G.best].p)G.best=t.id;sndWin();boom(70)}else sndLose();
US=null;UT=null;if(UM)UG=Math.min(UG,Math.floor(G.g));save();hud();render();
md(`<h2 class="ctr" style="padding-right:0">${win?'Апгрейд успешен':'Не повезло'}</h2><div class="won">${card(win?t:s)}</div><p class="ctr mute">${win?'Скин добавлен в инвентарь.':UM?'Голда сгорела. Попробуйте ещё раз.':'Скин сгорел. Попробуйте ещё раз.'}</p><button class="btn" onclick="closeM()">Дальше</button>`)},4800)}
const T={cases:['Кейсы',vCases],up:['Апгрейд',vUp],ch:['Курочка',vCh],inv:['Инвентарь',vInv],me:['Профиль',vMe]};
function render(){if(tab!='me')rs=0;$('nav').innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${T[k][0]}</button>`).join('');$('v').innerHTML=T[tab][1]();if(tab=='ch')chScroll()}
/* админка для GitHub: 5 тапов по логотипу KRIME + пароль */
const APW='krime2026';
function admOk(){if($('ap').value===APW){ADM=1;try{localStorage.setItem('krime_adm','1')}catch(e){}$('adb').hidden=false;shown=null;hud();adm()}else toast('Неверный пароль')}
try{if(localStorage.getItem('krime_adm')=='1'){ADM=1;$('adb').hidden=false}}catch(e){}
{let n=0,t;document.querySelector('.logo').addEventListener('click',()=>{clearTimeout(t);t=setTimeout(()=>n=0,1500);if(++n<5)return;n=0;if(ADM)adm();else md(`<h2 style='padding-right:40px'>Вход для админа</h2><div class='bet' style='grid-template-columns:1fr 100px'><input id='ap' type='password' placeholder='Пароль'><button style='font-size:14px' onclick='admOk()'>Войти</button></div>`)})}
/* иконки оружия (силуэты по типу) */
const CT={USP:'p',G22:'p',P350:'p',Deagle:'p','TEC-9':'p',UMP45:'s',MP7:'s',P90:'s',M4:'r',M16:'r',AKR:'r',AKR12:'r',M40:'n',AWM:'n',SM1014:'h','FP-6':'h',Karambit:'k',M9:'f',Butterfly:'f',Flip:'f',Kunai:'f',Scorpion:'f'},
IP={p:'M8 6H52V14H37L34 18L30 28H21L25 18V14H8Z',s:'M4 9H14L17 6H51V14H34L32 17H24V28H17V17H12L4 19Z',r:'M2 12L12 11L18 8H46V12H62V15H46V17H34L32 20H25L23 29H16L18 20H12L10 22H2Z',n:'M2 16H18L22 13H34V10H46V13H62V17H38L35 20H27L25 29H18L20 20H2Z',h:'M2 13H48V17H36V20H2ZM36 17H44V20H36ZM46 13L60 16L58 25L50 22Z',f:'M3 16L30 8L42 12V20L30 24ZM42 8H46V24H42ZM46 11H60V21H46Z',k:'M8 6C34 3 46 18 35 29C31 20 24 14 8 12Z'};
const ico=w=>{const k=CT[w];return `<svg class="ic" viewBox="0 0 64 32" aria-hidden="true">${k?`<path d="${IP[k]}" fill="currentColor"/>`:`<circle cx="32" cy="16" r="13" fill="currentColor"/><text x="32" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">G</text>`}</svg>`};
/* мягкие звуки: колокольчики по пентатонике */
const PN=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
const bell=(q,t,d=.9,v=.12)=>{tone(q,t,d,'sine',v);tone(q*2,t,d*.5,'sine',v*.25)};
const sndWin=()=>[0,2,4,5,7,8].forEach((k,i)=>bell(PN[k],i*.11,1.1,.11));
const sndLose=()=>{bell(392,0,.7,.09);bell(329.63,.18,.9,.08)};
const sndCharge=()=>{for(let i=0;i<9;i++)tone(PN[i%5]*(i<5?.5:1),i*.5,.5,'sine',.05)};
const sndSpin=()=>{for(let i=0;i<16;i++)tone(880,Math.pow(i/16,.6)*5,.08,'sine',.03)};
const sndDrop=r=>[0,2,4].forEach((k,i)=>bell(PN[Math.min(k+r,8)],i*.09,.9+r*.1,.1));
Object.assign(window,{CH,adm,admOk,setN,setUM,setUG,sellMany,agive,askin,autoC,autoT,bet,bonus,chCash,chStart,chStep,closeM,doUp,go,openCase,pickS,pickT,reset,sell,sellAll,setBet,setD,spin});
hud();render();(function(){const fl=$('fl');['🎃','🦇','👻','🕸️','🎃','🦇'].forEach((e,i)=>{const s=document.createElement('i');s.textContent=e;s.style.cssText=`left:${8+i*16}%;animation-delay:${-i*3}s;animation-duration:${14+i*2}s`;fl.appendChild(s)});try{window.claude&&claude.use('user').then(u=>{if(u&&u.isOwner()){ADM=1;$('adb').hidden=false;shown=null;hud()}}).catch(()=>{})}catch(e){}})();

})();
</script>
